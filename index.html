<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scuderia Matášek</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a; /* Temná černá jako základ */
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            height: 100%;
        }

        /* Hero sekce s pojistkou */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), #0a0a0a), 
                        url('https://images.unsplash.com/photo-1592198084033-aade902d1aae?q=80&w=1920') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 5px solid #dc2626; /* Ferrari červená linka */
        }

        .hero h1 {
            font-size: 4rem;
            margin: 0;
            color: #dc2626;
            text-transform: uppercase;
            font-style: italic;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 20px;
            color: #cccccc;
        }

        .btn {
            background-color: #dc2626;
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .btn:hover {
            background-color: transparent;
            border-color: #dc2626;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <section class="hero">
        <span style="color: #fbbf24; font-weight: bold; letter-spacing: 3px;">MARANELLO EDITION</span>
        <h1>PASSIONE<span> ITALIANA</span></h1>
        <p>Vítejte ve světě, kde rychlost potkává eleganci. Vaše cesta za dokonalostí začíná zde.</p>
        <a href="#" class="btn">Vstoupit do garáže</a>
    </section>

</body>
</html>
