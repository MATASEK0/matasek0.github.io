<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matášek | Profil</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), #a855f7);
            margin: 0 auto 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
        }
        h1 { margin: 0; font-size: 1.8rem; }
        p { color: #94a3b8; margin: 0.5rem 0 1.5rem; }
        .links { display: flex; flex-direction: column; gap: 0.8rem; }
        .link {
            background: rgba(255,255,255,0.05);
            padding: 0.8rem;
            border-radius: 0.8rem;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .link:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .status {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-img">M</div>
        <div class="status">Online a připraven</div>
        <h1>Matášek</h1>
        <p>Student SPŠE | Linux & Networking Enthusiast</p>
        
        <div class="links">
            <a href="https://github.com/MATASEK0" class="link">📂 Můj GitHub</a>
            <a href="#" class="link">📝 Maturitní projekt</a>
            <a href="#" class="link">☕ Napiš mi</a>
        </div>
    </div>
</body>
</html>
